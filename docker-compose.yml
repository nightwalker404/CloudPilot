services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "12434:11434"
    volumes:
      - /usr/share/ollama/.ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cloudpilot-net
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - cloudpilot-net
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: cloudpilot-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - ./searxng-cache:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=change-this-to-a-random-secret
    restart: unless-stopped
    networks:
      - cloudpilot-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpilot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - ollama
      - mongodb
    networks:
      - cloudpilot-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudpilot-frontend2
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloudpilot-net
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  cloudpilot-net:
    driver: bridge